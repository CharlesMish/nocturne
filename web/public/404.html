<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#09090b" />
    <title>Not found — Nocturne</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #09090b;
        color: #e8e1dc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(circle at 50% 28%, rgba(157, 105, 68, 0.14), transparent 36rem),
          #09090b;
      }

      main {
        width: min(36rem, 100%);
        padding: clamp(2rem, 6vw, 4rem);
        border: 1px solid #342b28;
        border-radius: 1.5rem;
        background: rgba(18, 16, 17, 0.88);
        box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.36);
      }

      .eyebrow {
        margin: 0 0 1.25rem;
        color: #ba9b88;
        font: 600 0.78rem/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 12ch;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.25rem, 8vw, 4rem);
        font-weight: 400;
        line-height: 0.98;
        letter-spacing: -0.035em;
      }

      .explanation {
        margin: 1.5rem 0 0;
        max-width: 31rem;
        color: #b9aeaa;
        font-size: 1rem;
        line-height: 1.7;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      a {
        min-height: 2.75rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.7rem 1rem;
        border: 1px solid #57453d;
        border-radius: 999px;
        color: #eee6e1;
        text-decoration: none;
        transition: border-color 160ms ease, background-color 160ms ease;
      }

      a:hover {
        border-color: #a97959;
        background: rgba(169, 121, 89, 0.12);
      }

      a:focus-visible {
        outline: 3px solid #d6a078;
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="not-found-title">
      <p class="eyebrow">Nocturne / 404</p>
      <h1 id="not-found-title">The room is quiet here.</h1>
      <p class="explanation">
        This address does not belong to the web edition. Return to Nocturne, or step back to the main index.
      </p>
      <nav aria-label="Not found navigation">
        <a href="/">Return to Nocturne</a>
        <a href="https://cmish.dev/">Visit cmish.dev</a>
      </nav>
    </main>
  </body>
</html>
