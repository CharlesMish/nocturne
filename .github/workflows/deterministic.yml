name: Deterministic checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  source:
    name: Python ${{ matrix.python-version }} source contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install known-good runtime graph
        run: python -m pip install -r requirements.txt -c constraints.txt
      - name: Run deterministic source checks
        run: |
          python scripts/sync_release_data.py --check
          python check_audio_contract.py --source
          node scripts/release-audit.mjs --source
          python scripts/runtime_smoke.py
          python scripts/profile_smoke.py
          python scripts/installer_smoke.py
          python scripts/path_safety_smoke.py
          python scripts/release_builder_smoke.py
          python -m compileall -q .

  browser:
    name: Manual browser smoke (${{ matrix.profile }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [nocturne, nocturne-pi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and QA-only browser dependency
        run: |
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps chromium
      - name: Run browser smoke
        run: python scripts/browser_smoke.py --profile "${{ matrix.profile }}"
