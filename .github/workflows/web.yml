name: Web checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web source and Worker bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test, build, verify, and dry-run the Worker bundle
        run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install hosted browser test dependencies
        run: |
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps chromium
      - name: Exercise hosted startup and real media playback
        run: python scripts/browser_smoke.py
